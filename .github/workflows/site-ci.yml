name: Site quality and build

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package*.json"
      - "next.config.ts"
      - ".github/workflows/site-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package*.json"
      - "next.config.ts"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm run seo:check
      - run: npm run build
