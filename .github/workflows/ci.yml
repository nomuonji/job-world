name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 派生データを生成
        run: npm run data:build

      - name: 生成物が最新か（ドリフト検出）
        run: git diff --exit-code -- src/data

      - name: データを検証（孤立ノード・到達性を含む）
        run: npm run data:validate

      - name: OGP画像が最新か（ドリフト検出）
        run: npm run og:check

      - name: 一時的に生成OGPを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-og
          path: public/og/
          retention-days: 1

      - name: 一時的に生成OGPをPRブランチへ同期
        if: failure() && github.event_name == 'pull_request'
        run: |
          git add public/og/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync generated OGP images"
          git push origin HEAD:${{ github.head_ref }}

      - run: npm run lint

      - name: 静的エクスポートが通るか
        run: npm run build

      - name: データ健全性をサマリに出す
        if: always()
        run: |
          if [ -f src/data/generated/graph-health.json ]; then
            echo '### データ健全性' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat src/data/generated/graph-health.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
