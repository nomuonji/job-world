profile:
  name: "資格と仕事の図鑑"
  x_handle: "@shikaku_catalog"
  threads_handle: "@certifications_catalog"
  bio: "資格を取ると、仕事の幅が広がる。資格カタログとしごと図鑑から毎日1つずつ紹介。資格の先にある仕事が見つかる図鑑📚"
